<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="echo_all_sounds">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>echo_all_sounds</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Echo All Sounds: HLS radio bridge (used for stations like BBC Radio 1) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script>
    var echoHls = null;
    var echoAudio = null;

    function echoInitAudio() {
      if (!echoAudio) {
        echoAudio = document.createElement('audio');
        echoAudio.id = 'echo-hls-audio';
        echoAudio.style.display = 'none';
        document.body.appendChild(echoAudio);
      }
      return echoAudio;
    }

    function echoPlayHls(url) {
      var audio = echoInitAudio();
      if (echoHls) {
        echoHls.destroy();
        echoHls = null;
      }
      if (window.Hls && Hls.isSupported()) {
        echoHls = new Hls();
        echoHls.loadSource(url);
        echoHls.attachMedia(audio);
        echoHls.on(Hls.Events.MANIFEST_PARSED, function () {
          audio.play();
        });
        echoHls.on(Hls.Events.ERROR, function (event, data) {
          console.error('HLS error', data);
        });
      } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
        audio.src = url;
        audio.play();
      } else {
        console.error('HLS not supported in this browser');
      }
    }

    function echoPauseHls() {
      if (echoAudio) echoAudio.pause();
    }

    function echoResumeHls() {
      if (echoAudio) echoAudio.play();
    }

    function echoStopHls() {
      if (echoHls) {
        echoHls.destroy();
        echoHls = null;
      }
      if (echoAudio) {
        echoAudio.pause();
        echoAudio.src = '';
      }
    }
  </script>
</body>
</html>
